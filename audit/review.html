<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label audit</title>
<style>
:root{--bg:#f7f6f1;--card:#fff;--ink:#14213d;--soft:#4a5568;--line:#ddd8cc;--acc:#b4531a;--yes:#2b5d9b;--no:#b4531a;--uns:#6b7a90}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--ink);color:#f7f6f1;flex-wrap:wrap}
header b{font-size:18px}.bar{flex:1;min-width:160px;height:8px;background:#3a5584;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#f2a65a}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:20px;padding:20px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chart img{width:100%;height:auto;display:block;border-radius:6px}
h2{font-size:20px;margin:0 0 8px}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-top:12px}
.ans{font-size:22px;font-weight:700}ul{margin:4px 0;padding-left:20px}
.q{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.q p{margin:0 0 6px;font-weight:600}
.opts{display:flex;gap:8px}.opts button{flex:1;padding:10px;border:2px solid var(--line);background:#fff;border-radius:8px;font-size:15px;cursor:pointer}
.opts button.on[data-v=Yes]{background:var(--yes);border-color:var(--yes);color:#fff}.opts button.on[data-v=No]{background:var(--no);border-color:var(--no);color:#fff}.opts button.on[data-v=Unsure]{background:var(--uns);border-color:var(--uns);color:#fff}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
nav{display:flex;gap:8px;margin-top:14px}nav button,.big{padding:10px 16px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer}nav button.sec{background:#c9d3e3;color:var(--ink)}
.start{max-width:640px;margin:60px auto}.start label{display:block;margin:10px 0}.hint{color:var(--soft);font-size:14px}
.warn{color:var(--no);font-weight:600}
</style></head><body>
<div id="app"></div>
<script>
const ITEMS = [{"id": "train-17463-426", "image": "../data/v2.0/images/train/17463.png", "question": "What's the color of graph whose largest value is 80?", "answer": "Red", "evidence": ["Red line 'Mostly bad news' starts at 80"], "rationale": "The red line has the largest value, 80 in December 2008; the yellow line peaks at 68 and green at 7."}, {"id": "train-04769019006554-1614", "image": "../data/v2.0/images/train/04769019006554.png", "question": "In which year, official development assistance(ODA) from Denmark and Switzerland are the same?", "answer": "2005", "evidence": ["Denmark and Switzerland lines meet at 2005 (~2.3 billion)"], "rationale": "The teal and purple lines overlap at 2005."}, {"id": "train-87453827004907-3340", "image": "../data/v2.0/images/train/87453827004907.png", "question": "Which category shown in Grey bar?", "answer": "Female", "evidence": ["Grey-blue bar = Female (39.4%)"], "rationale": "The slate grey bar is labelled Female."}, {"id": "train-two_col_81371-3891", "image": "../data/v2.0/images/train/two_col_81371.png", "question": "For how many years is the export above 2.5?", "answer": "4", "evidence": ["2008 3.68", "2009 2.84", "2010 3.17", "2011 2.86"], "rationale": "Values above 2.5: 3.68, 2.84, 3.17, 2.86. 2012 is 2.49, below. So four years."}, {"id": "train-1880-51", "image": "../data/v2.0/images/train/1880.png", "question": "What's the median value of red graph?", "answer": "59 (%)", "evidence": ["Republican/Lean Rep: 2017=62", "2018=59", "2019=48"], "rationale": "Red line values sorted are 48, 59, 62; the median is 59."}, {"id": "train-OECD_FDI_STOCKS_CAN_CHE_ISL_USA_000006-3046", "image": "../data/v2.0/images/train/OECD_FDI_STOCKS_CAN_CHE_ISL_USA_000006.png", "question": "What is the value of the highest bar?", "answer": "61.3 (% of GDP)", "evidence": ["Bar=Canada (61.3)"], "rationale": "Canada's bar is the tallest, labelled 61.3."}, {"id": "train-multi_col_1108-5791", "image": "../data/v2.0/images/train/multi_col_1108.png", "question": "What is the difference between highest value of employees and lowest value of employees ?", "answer": "69 (thousands)", "evidence": ["Employees 2007 = 184", "Employees 2009 = 115"], "rationale": "Employees: 156, 184, 137, 115. Highest 184 minus lowest 115 = 69."}, {"id": "train-multi_col_1365-5863", "image": "../data/v2.0/images/train/multi_col_1365.png", "question": "What is the difference between maximum urban population in Asia to the minimum urban population in Europe?", "answer": "3446.4 (millions)", "evidence": ["Asia 2050* 3479.06", "Europe 1950 246.19 (lowest Europe point)"], "rationale": "Asia maximum 3479.06; Europe minimum is at 1950, 246.19. 3479.06 - 246.19 = 3232.87."}, {"id": "train-multi_col_60887-6968", "image": "../data/v2.0/images/train/multi_col_60887.png", "question": "Which category in x-axis got 5.7 and 17.09 value in the chart?", "answer": "Multimedia & smart cameras", "evidence": ["Multimedia & smart cameras: 2013 = 5.7, 2014* = 17.09"], "rationale": "Both values appear on the Multimedia & smart cameras category."}, {"id": "train-multi_col_60155-6701", "image": "../data/v2.0/images/train/multi_col_60155.png", "question": "What is the difference between the highest and the lowest dark blue bar?", "answer": "0.6 (million units)", "evidence": ["Dark blue Private max 2013 (2.8)", "Private min 2009 (2.2)"], "rationale": "Dark blue (Private) ranges 2.2 to 2.8; difference = 0.6."}, {"id": "train-two_col_24257-5070", "image": "../data/v2.0/images/train/two_col_24257.png", "question": "which product has the highest share of revenue?", "answer": "Charms", "evidence": ["Charms 51%"], "rationale": "Charms has the tallest bar at 51%."}, {"id": "train-two_col_63497-3815", "image": "../data/v2.0/images/train/two_col_63497.png", "question": "What is the difference in share of people affected by natural disaster in africa and Asia continent?", "answer": "49.8 (%)", "evidence": ["Africa (24.3%)", "Asia (74.1%)"], "rationale": "74.1-24.3 = 49.8."}, {"id": "train-multi_col_80126-7066", "image": "../data/v2.0/images/train/multi_col_80126.png", "question": "Which restaurant has the highest price for all the years?", "answer": "Fleming's Prime Steakhouse and Wine Bar", "evidence": ["Fleming's Prime Steakhouse and Wine Bar (80, 83, 83, 80)"], "rationale": "Fleming's bars are 80-83 in all years versus 21-27 for the others."}, {"id": "train-two_col_40899-5164", "image": "../data/v2.0/images/train/two_col_40899.png", "question": "How many percentage Footwear occupied in the pie chart ?", "answer": "18.5 (%)", "evidence": ["Footwear 18.5%"], "rationale": "The Footwear slice is labelled 18.5%."}, {"id": "train-two_col_102625-4402", "image": "../data/v2.0/images/train/two_col_102625.png", "question": "Which month sees a drastic increase in CPI?", "answer": "Jul 2019", "evidence": ["Jun 2019 (110)", "Jul 2019 (121.3)"], "rationale": "The line jumps from 110 in Jun 2019 to 121.3 in Jul 2019, a drastic rise; other months change little."}, {"id": "train-two_col_955-4615", "image": "../data/v2.0/images/train/two_col_955.png", "question": "What is the difference between highest sales and lowest sales year?", "answer": "70 (million units)", "evidence": ["Bar=2017* (75)", "Bar=2014 (5)"], "rationale": "Highest 75, lowest 5; 75 minus 5 = 70."}, {"id": "train-16988-413", "image": "../data/v2.0/images/train/16988.png", "question": "What's the total value of highiest value of both red and yellow line?", "answer": "148 (%)", "evidence": ["Red 'Mostly bad news' peak (80)", "Yellow 'Mix of good and bad news' peak (68)"], "rationale": "Highest red value 80 (Dec 2008); highest yellow printed value 68. Sum 148."}, {"id": "train-two_col_5886-4911", "image": "../data/v2.0/images/train/two_col_5886.png", "question": "What is the difference between the most and the least popular mode of payment?", "answer": "51 (%)", "evidence": ["Debit or credit card 51%", "Payment by installments 0%, Unsure 0%"], "rationale": "Most popular 51%, least popular 0%. 51 - 0 = 51."}, {"id": "train-multi_col_60067-6659", "image": "../data/v2.0/images/train/multi_col_60067.png", "question": "What is the sum of highest value and lowest value of blue bar?", "answer": "6.1 (euros)", "evidence": ["Highest blue bar 2017/18 = 3.2", "Lowest blue bar 2013/14 = 2.9"], "rationale": "3.2 + 2.9 = 6.1."}, {"id": "train-two_col_3318-4641", "image": "../data/v2.0/images/train/two_col_3318.png", "question": "What is the total smartwatch sale in 2 years when it was lowest and highest?", "answer": "31.6 (million units)", "evidence": ["2016 (9)", "2020** (22.6)"], "rationale": "Lowest year 2016 is 9, highest 2020 is 22.6. 9 + 22.6 = 31.6."}, {"id": "train-multi_col_982-5934", "image": "../data/v2.0/images/train/multi_col_982.png", "question": "What flavor has the most sales in 2020?", "answer": "Chocolate", "evidence": ["2020 Chocolate 5265", "Sugar confectionery 585", "Biscuits 1125"], "rationale": "In 2020 chocolate at 5265 is the largest category."}, {"id": "train-17295-419", "image": "../data/v2.0/images/train/17295.png", "question": "What's the difference of value of highest value of red and lowest value of green line?", "answer": "79", "evidence": ["Red line (Mostly bad news) max = 80", "Green line (Mostly good news) min = 1"], "rationale": "Highest red value is 80 (Dec 2008), lowest green is 1. Difference = 79."}, {"id": "train-OECD_PRIVATE_PENSION_ASSETS_CHE_IDN_SGP_THA_TUR_000006-3140", "image": "../data/v2.0/images/train/OECD_PRIVATE_PENSION_ASSETS_CHE_IDN_SGP_THA_TUR_000006.png", "question": "How many places assets are present in the chart?", "answer": "5", "evidence": ["Bars: Indonesia, Thailand, Turkey, Singapore, Switzerland"], "rationale": "Five countries have bars in the chart."}, {"id": "train-multi_col_938-5921", "image": "../data/v2.0/images/train/multi_col_938.png", "question": "What's the percent difference between 2010 and 2020 when it comes to Services?", "answer": "1.64 (%)", "evidence": ["Services 2010 (77.97%)", "Services 2020 (79.61%)"], "rationale": "79.61 - 77.97 = 1.64 percentage points."}, {"id": "train-multi_col_20502-6144", "image": "../data/v2.0/images/train/multi_col_20502.png", "question": "What does the navy blue indicate?", "answer": "Sales through NIKE Direct", "evidence": ["Legend: navy = Sales through NIKE Direct"], "rationale": "The legend shows navy blue marks Sales through NIKE Direct; light blue is wholesale, grey is global brand divisions."}, {"id": "train-multi_col_80073-7039", "image": "../data/v2.0/images/train/multi_col_80073.png", "question": "What is the average value of Intercontinental economy-class bookings from 2009 to 2010?", "answer": "52.5 (%)", "evidence": ["Intercontinental 2009 (51%)", "Intercontinental 2010 (54%)"], "rationale": "Average of 51 and 54 = 105/2 = 52.5."}, {"id": "train-two_col_81850-3919", "image": "../data/v2.0/images/train/two_col_81850.png", "question": "Which year experienced is the biggest increase in employee number?", "answer": "2018", "evidence": ["Bar=2017 (3790)", "Bar=2018 (3822)"], "rationale": "Employee numbers fall nearly every year; the only increase is 2017 to 2018 (+32)."}, {"id": "train-two_col_173-3593", "image": "../data/v2.0/images/train/two_col_173.png", "question": "What is the value of the highest bar?", "answer": "28.39 (billion U.S. dollars)", "evidence": ["Media networks (28.39)"], "rationale": "Tallest bar is Media networks at 28.39 billion US dollars."}, {"id": "train-OECD_TAX_ON_CORPORATE_PROFITS_KOR_NLD_000068-3554", "image": "../data/v2.0/images/train/OECD_TAX_ON_CORPORATE_PROFITS_KOR_NLD_000068.png", "question": "Which country is represented by blue color line?", "answer": "Korea", "evidence": ["Blue line labelled Korea"], "rationale": "The blue line is labelled Korea; the red line is Netherlands."}, {"id": "train-multi_col_393-5441", "image": "../data/v2.0/images/train/multi_col_393.png", "question": "In which year is the sum of Agriculture and Industry being the lowest in the employment distribution of Indonesia?", "answer": "2020", "evidence": ["2020 Agriculture 27.73% + Industry 22.65% = 50.38%", "2010 39.15+18.66=57.81"], "rationale": "Agriculture plus Industry falls steadily as Services rises; 2020 has the lowest sum (50.38%)."}, {"id": "train-multi_col_100182-7170", "image": "../data/v2.0/images/train/multi_col_100182.png", "question": "How many areas have been considered?", "answer": "6", "evidence": ["x categories: London (50 miles), London (25 miles), Cambridge, Edinburgh, Manchester, Oxford"], "rationale": "Six area categories appear on the x-axis."}, {"id": "train-two_col_63068-3802", "image": "../data/v2.0/images/train/two_col_63068.png", "question": "Which Product has the highest revenue share of the Kering Group worldwide in 2020?", "answer": "Leather goods", "evidence": ["Leather goods 52%", "Shoes 20%", "Ready-to-wear 15%"], "rationale": "Leather goods has the largest slice at 52%."}, {"id": "train-7274-2755", "image": "../data/v2.0/images/train/7274.png", "question": "What is the average of Some in the bottom 3 category?", "answer": "25 (%)", "evidence": ["Amount you pay in taxes Some 26", "Some poor people Some 20", "Complexity Some 29"], "rationale": "Bottom 3 rows have Some = 29, 26, 20; sum 75, divided by 3 = 25."}, {"id": "train-two_col_24560-5095", "image": "../data/v2.0/images/train/two_col_24560.png", "question": "What is the difference between the total and United states?", "answer": "2000 (employees)", "evidence": ["Total 22 100", "United States 20 100"], "rationale": "22100 - 20100 = 2000."}, {"id": "train-two_col_102452-4379", "image": "../data/v2.0/images/train/two_col_102452.png", "question": "How many people do not have child?", "answer": "80 (%)", "evidence": ["Employed, no child (47%)", "Not employed, no child (33%)"], "rationale": "The bars with no child are 47% and 33%; summing gives 80. Bars are percentages of respondents, so this is a percentage sum."}, {"id": "train-multi_col_20491-6139", "image": "../data/v2.0/images/train/multi_col_20491.png", "question": "What is the average percentage of respondents who think coronavirus outbreak Highly affected the personal economy in Mexico as of May 14 and April 25?", "answer": "74.4 (%)", "evidence": ["Highly/somewhat affected April 25 72.3%", "Highly/somewhat affected May 14 76.5%"], "rationale": "Chart does not name Mexico or separate 'highly'; using the Highly/somewhat affected bars, (72.3 + 76.5) / 2 = 74.4."}, {"id": "train-1683-2093", "image": "../data/v2.0/images/train/1683.png", "question": "Does the threat of Global climate change more then China's power and influence ?", "answer": "No", "evidence": ["Global climate change 60", "China's power and influence 62"], "rationale": "Climate change 60 is less than China's power and influence at 62, so no."}, {"id": "train-two_col_285-3608", "image": "../data/v2.0/images/train/two_col_285.png", "question": "In what year did the GDP change the most?", "answer": "2020", "evidence": ["2020: 2.27%", "2021*: 8.44%"], "rationale": "Largest year-over-year jump in GDP change is 2020 (2.27%) to 2021 (8.44%), about 6.2 points, bigger than the 2019-2020 drop of 3.6."}, {"id": "train-two_col_41689-5209", "image": "../data/v2.0/images/train/two_col_41689.png", "question": "What's the combined percentage of cases from Europe and America?", "answer": "44 (%)", "evidence": ["Europe 15.9%", "America 28.1%"], "rationale": "15.9 + 28.1 = 44.0."}, {"id": "train-OECD_TRADE_IN_GOODS_EST_G-7_GRC_JPN_POL_000009-3177", "image": "../data/v2.0/images/train/OECD_TRADE_IN_GOODS_EST_G-7_GRC_JPN_POL_000009.png", "question": "What's the sum of all the bars above 20?", "answer": "66.8", "evidence": ["Japan 24.0", "Estonia 42.8"], "rationale": "Only Japan (24.0) and Estonia (42.8) exceed 20; sum 66.8."}, {"id": "train-multi_col_80100-7057", "image": "../data/v2.0/images/train/multi_col_80100.png", "question": "What is the median value of agriculture share in GDP?", "answer": "6.48 (%)", "evidence": ["Agriculture 2009-2019: 5.92, 6.08, 6.16, 6.24, 6.36, 6.48, 6.61, 6.88, 6.93, 7.15, 7.24"], "rationale": "Eleven values sorted; the sixth is 6.48."}, {"id": "train-16988-412", "image": "../data/v2.0/images/train/16988.png", "question": "What's the highest value of red line?", "answer": "80 (%)", "evidence": ["Red line 'Mostly bad news' Dec 2008 (80)"], "rationale": "The red line starts at 80 in December 2008 and never exceeds that afterward."}, {"id": "train-multi_col_60777-6900", "image": "../data/v2.0/images/train/multi_col_60777.png", "question": "In which year did foreign revenue reach the peak?", "answer": "2019", "evidence": ["Foreign revenue 2019 (5.21)", "2018 (4.93)"], "rationale": "Dark blue Foreign revenue bars rise over time; the highest is 5.21 in 2019."}, {"id": "train-two_col_42750-5243", "image": "../data/v2.0/images/train/two_col_42750.png", "question": "What is the average of all the bars ?", "answer": "12.48 (billion Malaysian ringgit)", "evidence": ["Bars: 14.2, 13.69, 12.17, 12.06, 12.25, 12.48, 10.54"], "rationale": "Sum is 87.39 over 7 bars; 87.39 / 7 = 12.484."}, {"id": "train-multi_col_40696-6525", "image": "../data/v2.0/images/train/multi_col_40696.png", "question": "What is the difference between the values of two bars in 2018?", "answer": "30.6 (billion U.S. dollars)", "evidence": ["2018 Asia-Pacific = 7", "2018 All other regions = 37.6"], "rationale": "37.6 - 7 = 30.6."}, {"id": "train-multi_col_60271-6733", "image": "../data/v2.0/images/train/multi_col_60271.png", "question": "What is the average of Asia's revenue from textiles in 2013 and 2014? (In Million Euros)", "answer": "1495 (million euros)", "evidence": ["Asia 2013=1 685", "Asia 2014=1 305"], "rationale": "(1685 + 1305) / 2 = 1495. The chart shows export revenue by region."}, {"id": "train-multi_col_40625-6507", "image": "../data/v2.0/images/train/multi_col_40625.png", "question": "What is the difference between highest standard of living is getting better or getting worse?", "answer": "19 (%)", "evidence": ["Getting better 2012 (54%)", "Getting worse 2013 (35%)"], "rationale": "Highest Getting better is 54%, highest Getting worse is 35%; difference 19."}, {"id": "train-84376745004992-1920", "image": "../data/v2.0/images/train/84376745004992.png", "question": "What does the green line represent?", "answer": "Boys, all", "evidence": ["Green line labelled 'Boys, all'"], "rationale": "The green/teal line is labelled Boys, all at its right end."}, {"id": "train-two_col_81036-3851", "image": "../data/v2.0/images/train/two_col_81036.png", "question": "How many year have consumption more than 1000 millions U.S. dollars?", "answer": "2", "evidence": ["2018 (1064)", "2019 (1145)"], "rationale": "Only 2018 and 2019 exceed 1000; all other years are below 1000."}, {"id": "train-multi_col_40648-6514", "image": "../data/v2.0/images/train/multi_col_40648.png", "question": "Which has the highest average annual sponsorship revenue?", "answer": "Real Madrid", "evidence": ["Real Madrid 158+34+28 = 220"], "rationale": "Real Madrid has the longest total bar, about 220 million dollars, highest of all clubs."}];
const CHECKS = [["answer_correct","Is the ANSWER correct when you read the chart yourself? (numbers within about 5% count)"],
 ["evidence_matches","Do the EVIDENCE values really appear in the chart?"],
 ["rationale_ok","Does the RATIONALE correctly lead to the answer?"]];
let who = null, i = 0, data = {};
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const key = () => "audit_v2_reviewer_" + who;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done = it => CHECKS.every(([k]) => (data[it.id]||{})[k]);
function save(){ store.set(key(), {i, data}); }
function start(){
  document.getElementById("app").innerHTML = `<div class="start card"><h2>Human audit of ChartAudit-Fin v2.0 labels</h2>
  <p>You will see ${ITEMS.length} training items, one at a time. For each, look at the chart and answer three questions with Yes, No or Unsure. Add a short note for any No or Unsure.</p>
  <p>Work on your own. Do not look at the other reviewer's answers.</p>
  <p class="lbl">I am</p>
  <label><input type="radio" name="r" value="A"> Reviewer A</label><label><input type="radio" name="r" value="B"> Reviewer B</label>
  <p class="hint">Your progress is saved in this browser, so you can close the page and come back. At the end, click "Download my results".</p>
  <button class="big" id="go">Start</button></div>`;
  document.getElementById("go").onclick = () => {
    const r = document.querySelector("input[name=r]:checked"); if(!r) return alert("Choose Reviewer A or B");
    who = r.value; const s = store.get(key()); if(s){ i = s.i||0; data = s.data||{}; } render(); };
}
function render(){
  const it = ITEMS[i], d = data[it.id] || (data[it.id] = {}), n = ITEMS.filter(done).length;
  document.getElementById("app").innerHTML = `<header><b>Reviewer ${who} · item ${i+1} of ${ITEMS.length}</b>
   <div class="bar"><i style="width:${100*n/ITEMS.length}%"></i></div><span>${n} done</span>
   <button class="big" id="dl" style="background:#f2a65a;color:#14213d">Download my results</button></header>
  <main><div class="card chart"><img src="${esc(it.image)}" alt="Chart for item ${i+1}" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'warn',textContent:'Chart not found. Open this page from the audit folder inside the repo.'}))"></div>
  <div class="card"><h2>${esc(it.question)}</h2>
   <div class="lbl">Answer</div><div class="ans">${esc(it.answer)}</div>
   <div class="lbl">Evidence</div><ul>${(it.evidence||[]).map(e=>`<li>${esc(e)}</li>`).join("") || "<li>(none)</li>"}</ul>
   <div class="lbl">Rationale</div><div>${esc(it.rationale)}</div>
   ${CHECKS.map(([k,t]) => `<div class="q"><p>${t}</p><div class="opts">${["Yes","No","Unsure"].map(v=>`<button data-k="${k}" data-v="${v}" class="${d[k]===v?"on":""}">${v}</button>`).join("")}</div></div>`).join("")}
   <div class="q"><p>Notes (needed for any No or Unsure)</p><textarea id="note">${esc(d.notes||"")}</textarea></div>
   <nav><button class="sec" id="prev">◀ Back</button><button id="next">${i===ITEMS.length-1?"Finish":"Next ▶"}</button><button class="sec" id="skip">Next unfinished</button></nav>
  </div></main>`;
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => { d[b.dataset.k] = b.dataset.v; save(); render(); });
  document.getElementById("note").oninput = e => { d.notes = e.target.value; save(); };
  document.getElementById("prev").onclick = () => { if(i>0){ i--; save(); render(); } };
  document.getElementById("next").onclick = () => { if(i<ITEMS.length-1){ i++; save(); render(); } else finish(); };
  document.getElementById("skip").onclick = () => { const j = ITEMS.findIndex(x => !done(x)); if(j>=0){ i=j; save(); render(); } else finish(); };
  document.getElementById("dl").onclick = download;
}
function finish(){
  const left = ITEMS.filter(x => !done(x)).length;
  if(left) { alert(left + " item(s) still have unanswered questions. 'Next unfinished' takes you to them."); return; }
  download();
}
function download(){
  const out = {reviewer: who, made: new Date().toISOString(), items: ITEMS.map((it,n) => ({n: n+1, id: it.id, ...(data[it.id]||{})}))};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"}));
