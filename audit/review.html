<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label audit</title>
<style>
:root{--bg:#f7f6f1;--card:#fff;--ink:#14213d;--soft:#4a5568;--line:#ddd8cc;--acc:#b4531a;--yes:#2b5d9b;--no:#b4531a;--uns:#6b7a90}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--ink);color:#f7f6f1;flex-wrap:wrap}
header b{font-size:18px}.bar{flex:1;min-width:160px;height:8px;background:#3a5584;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#f2a65a}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:20px;padding:20px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chart img{width:100%;height:auto;display:block;border-radius:6px}
h2{font-size:20px;margin:0 0 8px}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-top:12px}
.ans{font-size:22px;font-weight:700}ul{margin:4px 0;padding-left:20px}
.q{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.q p{margin:0 0 6px;font-weight:600}
.opts{display:flex;gap:8px}.opts button{flex:1;padding:10px;border:2px solid var(--line);background:#fff;border-radius:8px;font-size:15px;cursor:pointer}
.opts button.on[data-v=Yes]{background:var(--yes);border-color:var(--yes);color:#fff}.opts button.on[data-v=No]{background:var(--no);border-color:var(--no);color:#fff}.opts button.on[data-v=Unsure]{background:var(--uns);border-color:var(--uns);color:#fff}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
nav{display:flex;gap:8px;margin-top:14px}nav button,.big{padding:10px 16px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer}nav button.sec{background:#c9d3e3;color:var(--ink)}
.start{max-width:640px;margin:60px auto}.start label{display:block;margin:10px 0}.hint{color:var(--soft);font-size:14px}
.warn{color:var(--no);font-weight:600}
</style></head><body>
<div id="app"></div>
<script>
const ITEMS = [{"id": "train-00784700010464-1029", "image": "../data/v2.0/images/train/00784700010464.png", "question": "What is the difference in the value of National rail and Bus?", "answer": "64 (g)", "evidence": ["National rail=41 g", "Bus=105 g"], "rationale": "105-41=64."}, {"id": "train-28996933007140-1320", "image": "../data/v2.0/images/train/28996933007140.png", "question": "Can you see any value 25% in this graph?", "answer": "No", "evidence": ["Printed values: 40.6%, 26.2%, 6.7%, 1.4%"], "rationale": "No bar is labelled 25%; closest is 26.2%."}, {"id": "train-27867178011897-1306", "image": "../data/v2.0/images/train/27867178011897.png", "question": "What is the value of longest bar?", "answer": "153.56 (deaths per 100,000)", "evidence": ["Marshall Islands 153.56"], "rationale": "The longest bar is Marshall Islands at 153.56."}, {"id": "train-multi_col_100783-5596", "image": "../data/v2.0/images/train/multi_col_100783.png", "question": "Find the missing data (in percentage), 35,38,11,11,21,21,15,13,17?", "answer": "18 (%)", "evidence": ["Speciality: 35, 11, 21, 15, 18", "Consumables: 38, 11, 21, 13, 17"], "rationale": "All values listed appear in the chart except 18 (Speciality, 5 - Very Important), which is the missing one."}, {"id": "train-two_col_1645-4560", "image": "../data/v2.0/images/train/two_col_1645.png", "question": "which year has the highest revenue?", "answer": "2018", "evidence": ["2018=27.25", "2019=27"], "rationale": "The tallest bar is 2018 at 27.25."}, {"id": "train-multi_col_848-5901", "image": "../data/v2.0/images/train/multi_col_848.png", "question": "What is the difference between the maximum percentage of people between age group of 18-29 yrs to the minimum percentage of people in age group 61 yrs or older who use fitness app over the years?", "answer": "26 (%)", "evidence": ["18 to 29 years max (29%)", "61 years and older min (3%)"], "rationale": "Maximum for 18-29 is 29% (use it regularly); minimum for 61+ is 3% (used once). 29 - 3 = 26."}, {"id": "train-multi_col_80565-7270", "image": "../data/v2.0/images/train/multi_col_80565.png", "question": "What is the value of import from Armenia in the year 2015?", "answer": "209.6 (million U.S. dollars)", "evidence": ["2015 Armenia (209.6)"], "rationale": "Armenia (dark navy) bar in 2015 is labelled 209.6."}, {"id": "train-multi_col_80100-7057", "image": "../data/v2.0/images/train/multi_col_80100.png", "question": "What is the median value of agriculture share in GDP?", "answer": "6.48 (%)", "evidence": ["Agriculture 2009-2019: 5.92, 6.08, 6.16, 6.24, 6.36, 6.48, 6.61, 6.88, 6.93, 7.15, 7.24"], "rationale": "Eleven values sorted; the sixth is 6.48."}, {"id": "train-2471-2247", "image": "../data/v2.0/images/train/2471.png", "question": "Is the sum of the two smallest values greater than the value of the 'Lack of mobile service' bar in the graph?", "answer": "Yes", "evidence": ["No apps or websites in their language 12", "Not being allowed to have a phone 12", "Lack of mobile service 18"], "rationale": "Two smallest values are 12 and 12, sum 24, which is greater than 18."}, {"id": "train-two_col_24108-5019", "image": "../data/v2.0/images/train/two_col_24108.png", "question": "What is the percentage we will get if we add equities and real estate ?", "answer": "43 (%)", "evidence": ["Equities 28.5%", "Real estate 14.5%"], "rationale": "28.5 + 14.5 = 43."}, {"id": "train-multi_col_60576-6816", "image": "../data/v2.0/images/train/multi_col_60576.png", "question": "What is the sales performance of accessories by Level/flat?", "answer": "36 (%)", "evidence": ["Accessories, Level/flat = 36%"], "rationale": "Navy Level/flat segment for Accessories is labelled 36%."}, {"id": "train-OECD_FOREIGN-BORN_UNEMPLOYMENT_IRL_NZL_SVK_SWE_USA_000028-3474", "image": "../data/v2.0/images/train/OECD_FOREIGN-BORN_UNEMPLOYMENT_IRL_NZL_SVK_SWE_USA_000028.png", "question": "At how many points did the lines representing Ireland and Sweden crossed each other?", "answer": "1", "evidence": ["Ireland (green) below Sweden (blue) in 2008 (~6.8 vs ~12.2)", "Ireland above Sweden in 2009 (~15.7 vs ~15.4)"], "rationale": "Green Ireland line starts below blue Sweden line and ends above it after 2008; they cross once between 2008 and 2009 and never again."}, {"id": "train-two_col_41302-5188", "image": "../data/v2.0/images/train/two_col_41302.png", "question": "Which brand occupied almost all the pie ?", "answer": "Prada", "evidence": ["Prada 84.2%"], "rationale": "Prada fills 84.2% of the pie, nearly all of it."}, {"id": "train-98384795000189-3446", "image": "../data/v2.0/images/train/98384795000189.png", "question": "What's the percentage value of top bar?", "answer": "64.8 (%)", "evidence": ["Tenth percentile (64.8%)"], "rationale": "The top bar, Tenth percentile, is labelled 64.8%."}, {"id": "train-04930672006502-1068", "image": "../data/v2.0/images/train/04930672006502.png", "question": "Which country represented by smallest bar?", "answer": "Europe", "evidence": ["Bar=Europe (0.9%)", "Bar=High-income (1.7%)"], "rationale": "The shortest bar is Europe at 0.9%."}, {"id": "train-multi_col_21109-6339", "image": "../data/v2.0/images/train/multi_col_21109.png", "question": "What is the difference between 2011 blue bar value and 2015 blue bar value ?", "answer": "201.1 (million U.S. dollars)", "evidence": ["Blue bar 2011 = 709.71", "Blue bar 2015 = 910.8"], "rationale": "910.8 - 709.71 = 201.09."}, {"id": "train-multi_col_20954-6300", "image": "../data/v2.0/images/train/multi_col_20954.png", "question": "In what year did the unemployment rate (overall) peak?", "answer": "2009", "evidence": ["Unemployment rate overall 2009 = 8.3%", "2010 = 8.1%"], "rationale": "The dark line peaks at 8.3% in 2009."}, {"id": "train-multi_col_20495-6141", "image": "../data/v2.0/images/train/multi_col_20495.png", "question": "What is the average of Shrek and Shrek 2 box office revenue in North America?", "answer": "354.45 (million U.S. dollars)", "evidence": ["Shrek North America 267.67", "Shrek 2 North America 441.23"], "rationale": "(267.67 + 441.23) / 2 = 708.9 / 2 = 354.45."}, {"id": "train-OECD_INCOME_INEQUALITY_CHL_CHN_GBR_ITA_000007-3088", "image": "../data/v2.0/images/train/OECD_INCOME_INEQUALITY_CHL_CHN_GBR_ITA_000007.png", "question": "How many bars are there in the chart?", "answer": "2", "evidence": ["Italy (0.330)", "United Kingdom (0.351)"], "rationale": "Two bars are shown."}, {"id": "train-43499794000548-1418", "image": "../data/v2.0/images/train/43499794000548.png", "question": "What's the value of yellow bar?", "answer": "47.77 (%)", "evidence": ["Yellow/orange bar=Upper middle income (47.77%)"], "rationale": "The yellow-orange bar is Upper middle income, labelled 47.77%."}, {"id": "train-multi_col_60155-6701", "image": "../data/v2.0/images/train/multi_col_60155.png", "question": "What is the difference between the highest and the lowest dark blue bar?", "answer": "0.6 (million units)", "evidence": ["Dark blue Private max 2013 (2.8)", "Private min 2009 (2.2)"], "rationale": "Dark blue (Private) ranges 2.2 to 2.8; difference = 0.6."}, {"id": "train-multi_col_82-7372", "image": "../data/v2.0/images/train/multi_col_82.png", "question": "Which year witnessed the smallest value of the blue bar?", "answer": "2018", "evidence": ["Blue (Agriculture) 2018 = 7%", "2019 = 7.1%", "2017 = 7.5%"], "rationale": "The smallest blue segment value is 7% in 2018."}, {"id": "train-two_col_81371-3891", "image": "../data/v2.0/images/train/two_col_81371.png", "question": "For how many years is the export above 2.5?", "answer": "4", "evidence": ["2008 3.68", "2009 2.84", "2010 3.17", "2011 2.86"], "rationale": "Values above 2.5: 3.68, 2.84, 3.17, 2.86. 2012 is 2.49, below. So four years."}, {"id": "train-multi_col_80158-7075", "image": "../data/v2.0/images/train/multi_col_80158.png", "question": "What is the sum of the largest investment and the smallest development?", "answer": "8.34", "evidence": ["Investment 2021=4.55 (largest)", "Development 2018=3.79 (smallest)"], "rationale": "4.55 + 3.79 = 8.34."}, {"id": "train-9646-2982", "image": "../data/v2.0/images/train/9646.png", "question": "How many categories are there in the chart??", "answer": "10", "evidence": ["Rising prices (92%)", "Traffic (51)", "10 bars listed"], "rationale": "Counting the issues from Rising prices down to Traffic gives 10."}, {"id": "train-14935655003519-1169", "image": "../data/v2.0/images/train/14935655003519.png", "question": "Is the average share of women in top two lowest wage occupations more than 90?", "answer": "Yes", "evidence": ["Childcare workers (95%)", "Home health aides (89%)"], "rationale": "Taking the top two listed occupations: (95 + 89) / 2 = 92, more than 90. If the two lowest shares were meant (49, 56) the answer would be No."}, {"id": "train-OECD_PRIVATE_PENSION_ASSETS_CHE_IDN_SGP_THA_TUR_000006-3141", "image": "../data/v2.0/images/train/OECD_PRIVATE_PENSION_ASSETS_CHE_IDN_SGP_THA_TUR_000006.png", "question": "Is the sum of lowest two value equal to the value of turkey?", "answer": "Yes", "evidence": ["Indonesia 13k", "Thailand 23k", "Turkey 36k"], "rationale": "Lowest two are 13k and 23k, sum 36k, equal to Turkey's 36k."}, {"id": "train-two_col_5989-4925", "image": "../data/v2.0/images/train/two_col_5989.png", "question": "What percentage of Feminine apparels are sold by Macy Inc. worldwide?", "answer": "16.8 (%)", "evidence": ["Slice=Feminine apparel (16.8%)"], "rationale": "The Feminine apparel slice label shows 16.8%."}, {"id": "train-two_col_81293-3886", "image": "../data/v2.0/images/train/two_col_81293.png", "question": "Which country contributes to most production?", "answer": "China", "evidence": ["China 76%"], "rationale": "China has the largest slice at 76%."}, {"id": "train-multi_col_40551-6478", "image": "../data/v2.0/images/train/multi_col_40551.png", "question": "The shortest light blue bar minus the longest dark blue bar yields what value?", "answer": "-2 (%)", "evidence": ["Light blue (Western Europe) shortest = 27% (India)", "Dark blue (USA) longest = 29% (Brazil)"], "rationale": "27 - 29 = -2."}, {"id": "train-two_col_62824-3792", "image": "../data/v2.0/images/train/two_col_62824.png", "question": "How many platforms are considered?", "answer": "7", "evidence": ["Labels: P2P Consumer, Real estate, P2P Business, Debt based, Equity-based, Donation-based, Balance sheet business lending"], "rationale": "Seven distinct labelled platform categories appear in the pie legend/labels."}, {"id": "train-two_col_100211-4140", "image": "../data/v2.0/images/train/two_col_100211.png", "question": "Which opinion has the highest value?", "answer": "To spend time with the family", "evidence": ["Bar=To spend time with the family (70%)"], "rationale": "The tallest bar is 'To spend time with the family' at 70%."}, {"id": "train-multi_col_20345-6076", "image": "../data/v2.0/images/train/multi_col_20345.png", "question": "What is the share of employment in percentage by the agriculture sector in 2020?", "answer": "12.73 (%)", "evidence": ["Agriculture 2020 (12.73%)"], "rationale": "Agriculture share in 2020 is printed as 12.73%."}, {"id": "train-multi_col_60381-6755", "image": "../data/v2.0/images/train/multi_col_60381.png", "question": "What is the difference between highest and lowest value of Relative poverty?", "answer": "5.8 (%)", "evidence": ["Relative poverty 2008=17.6%", "Relative poverty 2020=11.8%"], "rationale": "Highest 17.6, lowest 11.8; difference 5.8."}, {"id": "train-two_col_101106-4299", "image": "../data/v2.0/images/train/two_col_101106.png", "question": "For how many years has the inancial assets of private pension funds in the United States from 2000 to 2018 (in billion U.S. dollars) exceeded 9000?", "answer": "3", "evidence": ["2016 (9004)", "2017 (9752)", "2018 (9381)"], "rationale": "Bars above 9000: 2016 (9004), 2017 (9752), 2018 (9381). Earlier bars are all at or below 8675."}, {"id": "train-two_col_61379-3654", "image": "../data/v2.0/images/train/two_col_61379.png", "question": "When did car sales peak?", "answer": "2016", "evidence": ["2016 = 13 775 units", "2017 = 12 571"], "rationale": "Highest point on the line is 2016."}, {"id": "train-two_col_61683-3665", "image": "../data/v2.0/images/train/two_col_61683.png", "question": "What is the average of all the bars?", "answer": "7.8 (%)", "evidence": ["Bars 9, 8, 8, 7, 7 (%)"], "rationale": "Sum = 9 + 8 + 8 + 7 + 7 = 39; divide by 5 bars = 7.8."}, {"id": "train-11759-294", "image": "../data/v2.0/images/train/11759.png", "question": "Is there only one colour used to present the given graph?", "answer": "No", "evidence": ["Orange line (Strong economy)", "Green line (Good democracy)"], "rationale": "Two lines in two different colours are used, so not a single colour."}, {"id": "train-two_col_2380-4671", "image": "../data/v2.0/images/train/two_col_2380.png", "question": "What's the total Per capita consumption of beer in Germany from 2018 to 2019 (in liters)?", "answer": "201.7 (liters)", "evidence": ["2018 (102)", "2019 (99.7)"], "rationale": "Add per capita consumption for 2018 and 2019: 102 + 99.7 = 201.7."}, {"id": "train-96980063004401-1951", "image": "../data/v2.0/images/train/96980063004401.png", "question": "How many data points were recorded above 20 %?", "answer": "3", "evidence": ["2003 about 21.8%", "2012 about 21.1%", "2004 about 20.3%"], "rationale": "Points clearly above the 20% gridline are 2003, 2004 and 2012; 2007 sits right at 20 and is not counted."}, {"id": "train-4714-2434", "image": "../data/v2.0/images/train/4714.png", "question": "What's the percentage of Disapprove in Greece?", "answer": "92 (%)", "evidence": ["Row=Greece, Disapprove (92%)"], "rationale": "The Disapprove bar for Greece is labelled 92%."}, {"id": "train-multi_col_286-5408", "image": "../data/v2.0/images/train/multi_col_286.png", "question": "Which region has the highest aircraft fleets ?", "answer": "Asia Pacific", "evidence": ["Asia Pacific 2039*=18,770", "Asia Pacific 2019=8,020", "North America 2039*=10,610"], "rationale": "Asia Pacific has the longest bars in both 2019 and 2039, so it has the highest fleet."}, {"id": "train-04769019006554-1614", "image": "../data/v2.0/images/train/04769019006554.png", "question": "In which year, official development assistance(ODA) from Denmark and Switzerland are the same?", "answer": "2005", "evidence": ["Denmark and Switzerland lines meet at 2005 (~2.3 billion)"], "rationale": "The teal and purple lines overlap at 2005."}, {"id": "train-multi_col_20957-6302", "image": "../data/v2.0/images/train/multi_col_20957.png", "question": "Which has the highest box office revenue?", "answer": "Toy Story 4", "evidence": ["Toy Story 4 (434.04 + 1073.39)", "Toy Story 3 (415 + 1067)"], "rationale": "Stacked totals: TS4 about 1507, TS3 about 1482, TS2 about 743, TS about 565. Toy Story 4 is highest."}, {"id": "train-6100-2674", "image": "../data/v2.0/images/train/6100.png", "question": "In Oct 2017, How many percentages said Falling behind?", "answer": "49 (%)", "evidence": ["Row=Oct 2017, Falling behind (49)"], "rationale": "In the Oct 2017 row, the Falling behind column shows 49."}, {"id": "train-multi_col_20479-6134", "image": "../data/v2.0/images/train/multi_col_20479.png", "question": "What is the highest revenue for AbbVie from the International market between 2012 and 2020", "answer": "11229 (million U.S. dollars)", "evidence": ["International 2018 (11 229)", "International 2020 (10 925)", "International 2017 (9 965)"], "rationale": "Among dark navy International bars 2012 to 2020, the largest is 2018 at 11,229."}, {"id": "train-798-2148", "image": "../data/v2.0/images/train/798.png", "question": "What's the value of the yellow bar for \"Lives far away\" category?", "answer": "51 (%)", "evidence": ["Row=Lives far away, yellow (Definitely/probably would NOT) 51"], "rationale": "Yellow bar in the Lives far away row is labelled 51."}, {"id": "train-multi_col_100310-7211", "image": "../data/v2.0/images/train/multi_col_100310.png", "question": "Which country has maximum difference between the two factors?", "answer": "Europe", "evidence": ["Europe 90 vs 40 (diff 50)", "North America 35 vs 12 (23)", "Japan 60 vs 11 (49)"], "rationale": "Differences: Europe 50, North America 23, Japan 49. Europe is largest."}, {"id": "train-two_col_576-4620", "image": "../data/v2.0/images/train/two_col_576.png", "question": "Which in goods imports in the United Kingdom in 2020/21, by commodity (in million GBP) has the most?", "answer": "Machinery and transport equipment", "evidence": ["Machinery and transport equipment=151 122"], "rationale": "Longest bar is machinery and transport equipment."}, {"id": "train-two_col_100535-4193", "image": "../data/v2.0/images/train/two_col_100535.png", "question": "How many countries have less than 200 million euros?", "answer": "4", "evidence": ["Netherlands 198", "Scotland 110", "Portugal 114", "Russia 100"], "rationale": "Countries under 200: Netherlands, Scotland, Portugal, Russia = 4."}];
const CHECKS = [["answer_correct","Is the ANSWER correct when you read the chart yourself? (numbers within about 5% count)"],
 ["evidence_matches","Do the EVIDENCE values really appear in the chart?"],
 ["rationale_ok","Does the RATIONALE correctly lead to the answer?"]];
let who = null, i = 0, data = {};
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const key = () => "audit_v2_reviewer_" + who;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const done = it => CHECKS.every(([k]) => (data[it.id]||{})[k]);
function save(){ store.set(key(), {i, data}); }
function start(){
  document.getElementById("app").innerHTML = `<div class="start card"><h2>Human audit of ChartAudit-Fin v2.0 labels</h2>
  <p>You will see ${ITEMS.length} training items, one at a time. For each, look at the chart and answer three questions with Yes, No or Unsure. Add a short note for any No or Unsure.</p>
  <p>Work on your own. Do not look at the other reviewers' answers.</p>
  <p class="lbl">I am</p>
  <label><input type="radio" name="r" value="A"> Reviewer A</label><label><input type="radio" name="r" value="B"> Reviewer B</label><label><input type="radio" name="r" value="C"> Reviewer C</label>
  <p class="hint">Your progress is saved in this browser, so you can close the page and come back. At the end, click "Download my results".</p>
  <button class="big" id="go">Start</button></div>`;
  document.getElementById("go").onclick = () => {
    const r = document.querySelector("input[name=r]:checked"); if(!r) return alert("Choose Reviewer A, B or C");
    who = r.value; const s = store.get(key()); if(s){ i = s.i||0; data = s.data||{}; } render(); };
}
function render(){
  const it = ITEMS[i], d = data[it.id] || (data[it.id] = {}), n = ITEMS.filter(done).length;
  document.getElementById("app").innerHTML = `<header><b>Reviewer ${who} · item ${i+1} of ${ITEMS.length}</b>
   <div class="bar"><i style="width:${100*n/ITEMS.length}%"></i></div><span>${n} done</span>
   <button class="big" id="dl" style="background:#f2a65a;color:#14213d">Download my results</button></header>
  <main><div class="card chart"><img src="${esc(it.image)}" alt="Chart for item ${i+1}" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'warn',textContent:'Chart not found. Open this page from the audit folder inside the repo.'}))"></div>
  <div class="card"><h2>${esc(it.question)}</h2>
   <div class="lbl">Answer</div><div class="ans">${esc(it.answer)}</div>
   <div class="lbl">Evidence</div><ul>${(it.evidence||[]).map(e=>`<li>${esc(e)}</li>`).join("") || "<li>(none)</li>"}</ul>
   <div class="lbl">Rationale</div><div>${esc(it.rationale)}</div>
   ${CHECKS.map(([k,t]) => `<div class="q"><p>${t}</p><div class="opts">${["Yes","No","Unsure"].map(v=>`<button data-k="${k}" data-v="${v}" class="${d[k]===v?"on":""}">${v}</button>`).join("")}</div></div>`).join("")}
   <div class="q"><p>Notes (needed for any No or Unsure)</p><textarea id="note">${esc(d.notes||"")}</textarea></div>
   <nav><button class="sec" id="prev">◀ Back</button><button id="next">${i===ITEMS.length-1?"Finish":"Next ▶"}</button><button class="sec" id="skip">Next unfinished</button></nav>
  </div></main>`;
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => { d[b.dataset.k] = b.dataset.v; save(); render(); });
  document.getElementById("note").oninput = e => { d.notes = e.target.value; save(); };
  document.getElementById("prev").onclick = () => { if(i>0){ i--; save(); render(); } };
  document.getElementById("next").onclick = () => { if(i<ITEMS.length-1){ i++; save(); render(); } else finish(); };
  document.getElementById("skip").onclick = () => { const j = ITEMS.findIndex(x => !done(x)); if(j>=0){ i=j; save(); render(); } else finish(); };
  document.getElementById("dl").onclick = download;
}
function finish(){
  const left = ITEMS.filter(x => !done(x)).length;
  if(left) { alert(left + " item(s) still have unanswered questions. 'Next unfinished' takes you to them."); return; }
  download();
}
function download(){
  const out = {reviewer: who, made: new Date().toISOString(), items: ITEMS.map((it,n) => ({n: n+1, id: it.id, ...(data[it.id]||{})}))};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"}));
  a.download = "audit_reviewer_" + who + ".json"; document.body.appendChild(a); a.click(); a.remove();
}
start();
</script></body></html>
